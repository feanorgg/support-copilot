# Golden eval set: labels are written by hand here; only the ticket *text* is LLM-generated
# (eval/generate.py) from `scenario`, so the labels do not depend on the model under test.
#
# expected_action: draft_ready | specialist_review | abstain
# acceptable_actions: optional extra actions that are also fine (borderline cases)
# flags: expected true flags among trading_advice, complaint, kyc_aml
# gold_chunks: chunks a correct answer should retrieve/cite (empty for out-of-KB)
#
# Urgency rubric: high = money appears lost/stuck beyond stated timelines, account blocked or
# compromised, cannot withdraw, explicit escalation threat; medium = waiting on an in-progress
# transaction/verification; low = general information.
# The mix over-weights hard cases on purpose (it is a stress test, not a traffic sample);
# the business case re-weights results by an assumed production mix.

defaults: {sentiment: neutral, urgency: low, flags: [], acceptable_actions: [], gold_chunks: []}

tickets:
  # ---------------- In-KB: deposits ----------------
  - {id: dep-01, language: en, category: deposit, expected_action: draft_ready, gold_chunks: [deposit#faq-minimum-deposit-amount],
     scenario: "New client asks what the minimum deposit is."}
